name: Build and publish app store

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app store bundle
        uses: IceWhaleTech/build-appstore-action@main
        with:
          source: .
          output: dist
          base-url: https://nazarborodavka.github.io/owlbear-sync-store/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
