name: Update app from new image build

# Fired cross-repo by owlbear-sync's own docker-publish.yml workflow after it
# pushes a new master image — see the "Notify app store" step there.
#
# This job builds and deploys the store bundle itself, rather than just
# committing the bump and relying on release-store.yml's `on: push` trigger
# to pick it up: a commit pushed using the workflow's own GITHUB_TOKEN does
# NOT trigger other workflows (GitHub's deliberate anti-recursion
# safeguard), so that hand-off silently never happened — the source file on
# `main` was correctly updated every time, but the published gh-pages site
# ZimaOS/CasaOS actually reads was frozen at the very first build.
# release-store.yml still exists to cover a real, manually-pushed edit to
# this repo (a human push isn't subject to that restriction).
on:
  repository_dispatch:
    types: [new-image]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update docker-compose.yml with new build
        env:
          NEW_TAG: ${{ github.event.client_payload.tag }}
          NEW_VERSION: ${{ github.event.client_payload.version }}
          NEW_DATE: ${{ github.event.client_payload.date }}
        run: |
          set -euo pipefail
          FILE="Apps/OwlbearTracker/docker-compose.yml"
          if [ -z "${NEW_TAG:-}" ]; then
            echo "Missing client_payload.tag in dispatch event" >&2
            exit 1
          fi

          sed -i "s|image: ghcr.io/nazarborodavka/owlbear-tracker:.*|image: ghcr.io/nazarborodavka/owlbear-tracker:${NEW_TAG}|" "$FILE"
          sed -i "s|^  version: \".*\"|  version: \"${NEW_VERSION}\"|" "$FILE"
          sed -i "s|^  update_at: \".*\"|  update_at: \"${NEW_DATE}\"|" "$FILE"

          echo "Updated $FILE:"
          grep -E "image:|version:|update_at:" "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Apps/OwlbearTracker/docker-compose.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump owlbear-tracker to ${{ github.event.client_payload.tag }}"
            git push origin main
          fi

      - name: Build app store bundle
        uses: IceWhaleTech/build-appstore-action@v1.1.2
        with:
          source: .
          output: dist
          base-url: https://nazarborodavka.github.io/owlbear-sync-store/

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
